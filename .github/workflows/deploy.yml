name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check Firebase setup
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.PHOTOPUB }}
        run: |
          if [ -z "$SA" ]; then
            echo "::notice::Skipping deploy: add the FIREBASE_SERVICE_ACCOUNT secret (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Build
        if: steps.check.outputs.ready == 'true'
        run: npm ci && npm run build

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.PHOTOPUB }}
          channelId: live
